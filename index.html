<style>
/* Layout: full-bleed canvas game; DOM overlays (menu, pause, results) slide over the live scene from the left */
:root{
  --ink:#05070e; --ink-2:#121826; --cream:#eae6dc; --gold:#ffb43a; --rose:#ff5a36; --teal:#62e3ff; --mute:#9aa3bd;
  --f-display:"Unbounded","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden}
body{font-family:var(--f-body);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none;background:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;background:var(--ink)}
#game.post{opacity:0}
.screen{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(5,7,14,.95) 0%,rgba(5,7,14,.8) 42%,rgba(5,7,14,.1) 100%);cursor:default}
.panel{width:min(580px,100%);margin-left:clamp(0px,6vw,96px);display:flex;flex-direction:column;gap:20px;margin-block:auto}
.eyebrow{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0}
.logo{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,9vw,108px);line-height:.92;margin:0;color:var(--gold);letter-spacing:-.02em;transform:skewX(-7deg);transform-origin:left;
  text-shadow:5px 5px 0 var(--rose),10px 10px 0 rgba(98,227,255,.3),0 0 70px rgba(255,180,58,.35)}
.logo span{display:block;color:var(--cream)}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,48px);line-height:1.04;margin:0;color:var(--gold);text-wrap:balance;transform:skewX(-6deg);transform-origin:left;text-shadow:4px 4px 0 var(--rose)}
.lead{font-size:17px;line-height:1.5;max-width:48ch;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:12px}
button{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:4px;padding:15px 26px;cursor:pointer;
  background:var(--gold);color:var(--ink);box-shadow:4px 4px 0 var(--rose);transition:transform .12s,box-shadow .12s}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--rose)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rose)}
button.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px rgba(234,230,220,.4)}
button.ghost:hover{box-shadow:inset 0 0 0 2px var(--cream)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;margin:0;font-size:14px;color:var(--mute);align-items:baseline}
.keys dt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:baseline}
.keys dd{margin:0;line-height:1.4}
kbd{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--cream);background:var(--ink-2);border:1px solid rgba(234,230,220,.25);border-bottom-width:3px;border-radius:4px;padding:3px 7px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(234,230,220,.16);border:1px solid rgba(234,230,220,.16);margin:0}
.stats div{background:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stats dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stats dd{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--cream);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);margin:0;max-width:52ch;line-height:1.5}
@media (max-width:560px){.screen{background:rgba(5,7,14,.9)}.keys{font-size:13px}.lead{font-size:16px}}
.panel{animation:panelIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes panelIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){button{transition:none}.panel{animation:none}}
</style>

 if(dx>0){const tx=Math.floor((b.x+b.w-.001)/T);for(let ty=y0;ty<=y1;ty++)if(isSolidT(tile(tx,ty))){b.x=tx*T-b.w;b.vx=0;b.hitWall=1;return}}
 else{const tx=Math.floor(b.x/T);for(let ty=y0;ty<=y1;ty++)if(isSolidT(tile(tx,ty))){b.x=(tx+1)*T;b.vx=0;b.hitWall=-1;return}}}
function stepY(b,dy){const pb=b.y+b.h;b.y+=dy;const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T);
 if(dy>0){const ty=Math.floor((b.y+b.h-.001)/T);for(let tx=x0;tx<=x1;tx++){const t=tile(tx,ty);if(isSolidT(t)||(t===2&&!(b.drop>0)&&pb<=ty*T+.01)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;b.hitY=true;return}}}
 else if(dy<0){const ty=Math.floor(b.y/T);for(let tx=x0;tx<=x1;tx++)if(isSolidT(tile(tx,ty))){b.y=(ty+1)*T;b.vy=0;b.hitY=true;return}}}
function onOneway(b){const ty=Math.floor((b.y+b.h+2)/T);return tile(Math.floor((b.x+2)/T),ty)===2||tile(Math.floor((b.x+b.w-2)/T),ty)===2}

   if(b.o===0){
    for(const e of enemies){if(e.dead)continue;const hx=e.x+e.w/2+e.face*3,hy=e.y+e.h-54;

function updParts(dt){
 if(parts.length>1100)parts.splice(0,parts.length-1100);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
  p.vy+=G*(p.g||0)*dt;if(p.drag){const f=Math.pow(p.drag,dt);p.vx*=f;p.vy*=f}
  const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
  if(p.k==='blood'&&solidAt(nx,ny)){decal(p.x,p.y,p.size*rand(.8,1.7),p.andro);parts.splice(i,1);continue}
  if((p.k==='shell'||p.k==='gun'||p.k==='chip')&&solidAt(nx,ny)){if(solidAt(p.x,ny)){p.vy*=-.35;p.vx*=.7;if(Math.abs(p.vy)<50)p.vy=0}else p.vx*=-.5;p.vr*=.6;continue}
  p.x=nx;p.y=ny;if(p.vr)p.rot+=p.vr*dt}
}
function makeRag(J,st,vx,vy,ix,iy,andro){
 const src=[J.head,J.neck,J.hip,J.arms[0].elbow,J.arms[0].hand,J.arms[1].elbow,J.arms[1].hand,J.legs[0].knee,J.legs[0].foot,J.legs[1].knee,J.legs[1].foot];
 const pts=src.map((q,i)=>({x:q.x,y:q.y,px:q.x,py:q.y,vx:vx+ix*(i<3?1.15:rand(.5,1))+rand(-60,60),vy:vy+iy*(i<3?1.15:rand(.5,1))+rand(-60,60)}));
 const sticks=[[0,1],[1,2],[1,3],[3,4],[1,5],[5,6],[2,7],[7,8],[2,9],[9,10],[0,2]].map(([a,b])=>[a,b,Math.hypot(pts[a].x-pts[b].x,pts[a].y-pts[b].y)]);
 return{pts,sticks,st,andro,sp:rand(.2,.8),spn:andro?10:0};
}
function updRag(r,dt){
 if(dt<=0)return;
 const rz=zgAt(r.pts[2].x)?.06:1;for(const p of r.pts){p.px=p.x;p.py=p.y;p.vy+=G*dt*rz;p.x+=p.vx*dt;p.y+=p.vy*dt;p.gr=false}
 for(let it=0;it<4;it++){
  for(const[a,b,len]of r.sticks){const A=r.pts[a],B=r.pts[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.001,k=(d-len)/d/2;A.x+=dx*k;A.y+=dy*k;B.x-=dx*k;B.y-=dy*k}
  for(const p of r.pts){if(solidAtP(p.x,p.y,p.py)){if(!solidAtP(p.px,p.y,p.py))p.x=p.px;else if(!solidAtP(p.x,p.py,p.py)){p.y=p.py;p.gr=true}else{p.x=p.px;p.y=p.py;p.gr=true}}}

  for(const ch of txt){const k=clamp((lt-.35-idx*.07)/.35,0,1);idx++;const cw=g.measureText(ch).width;if(k<=0){x+=cw;continue}
   const e=1-Math.pow(1-k,3),a=k<1&&Math.random()<.3?.3:e;g.save();g.translate(x,y+(1-e)*size*.25);g.transform(1,0,-.13,1,0,0);g.globalAlpha=a;
   g.fillStyle='#ff5a36';g.fillText(ch,size*.05,size*.05);g.fillStyle='rgba(98,227,255,.35)';g.fillText(ch,size*.1,size*.1);
   const gr=g.createLinearGradient(0,-size*.8,0,0);gr.addColorStop(0,col==='#ffb43a'?'#ffe2a6':'#ffffff');gr.addColorStop(1,col);g.fillStyle=gr;g.fillText(ch,0,0);g.restore();x+=cw}}
 g.globalAlpha=1;if((lt>2.2&&lt%3.7<.14)||(lt>.55&&lt<.75)){for(let i=0;i<6;i++){const sy=y1-size+Math.random()*size*2.2,shh=Math.random()*size*.18+2,dx=(Math.random()-.5)*size*.4;g.drawImage(cv,0,sy,CW,shh,dx,sy,CW,shh)}}
 g.textAlign='center';g.globalAlpha=clamp((lt-1.4)/.6,0,1);g.font=`500 ${Math.round(13*U)}px ${FM}`;g.fillStyle='#62e3ff';g.fillText('КОСМИЧЕСКИЙ НУАР · ГЛАВА 1 ИЗ 7',cx,y2+size*.42);
 g.globalAlpha=clamp((lt-2.4)/.5,0,1)*(.55+.45*Math.sin(lt*3.2));g.font=`700 ${Math.round(14*U)}px ${FM}`;g.fillStyle='#eae6dc';g.fillText('НАЖМИ ЛЮБУЮ КЛАВИШУ',cx,CH*.86);g.globalAlpha=1;g.textAlign='left'}
function toTitle(){if(S.state!=='boot')return;S.state='title';S.titleT0=S.t;addWave(CW/2,CH*.45,Math.max(CW,CH)*.9,1,1.1,true)}
function enterMenu(){if(S.state!=='title')return;initAudio();sfx.sting();S.state='menu';S.flash=0;addWave(CW/2,CH*.45,Math.max(CW,CH),1.2,1.2,true);showOverlay(menuHTML())}

/* ---------- screens ---------- */
function fmtTime(s){const m=Math.floor(s/60),r=Math.floor(s%60);return`${m}:${String(r).padStart(2,'0')}`}
function showOverlay(h){ov.innerHTML=h;ov.hidden=false;const b=ov.querySelector('button');if(b&&!touchMode)b.focus({preventScroll:true})}
function unlocked(){try{return+localStorage.getItem('mg_unlock')||0}catch(e){return 0}}
function unlock(n){try{if(n>unlocked())localStorage.setItem('mg_unlock',String(n))}catch(e){}}
function menuHTML(){const u=Math.min(unlocked(),LEVELS.length-1);let ch='';for(let i=1;i<=u;i++)ch+=`<button class="ghost" data-act="ch${i}">${LEVELS[i].chapter}</button>`;
 return`<div class="panel">
 <p class="eyebrow">7 глав · 3 концовки${(()=>{try{const n=JSON.parse(localStorage.getItem('mg_end')||'[]').length;return n?` · открыто ${n} из 3`:''}catch(e){return''}})()}</p>
 <h1 class="logo">Мёртвый<span>груз</span></h1>
 <p class="lead">Капитан Ярра Корд, болтливый дрон Тостер и рудовоз «Мнемозина», пропавший три года назад. В трюме ждёт контейнер за двести тысяч кредитов. На борту — андроиды, которые перебили экипаж и не любят гостей.</p>
 <div class="btns"><button data-act="start">Начать</button>${ch}</div>
 <dl class="keys">
  <dt><kbd>A</kbd><kbd>D</kbd></dt><dd>Бег</dd>
  <dt><kbd>W</kbd><kbd>Пробел</kbd></dt><dd>Прыжок. В воздухе — ещё один, у стены — отскок</dd>
  <dt><kbd>Мышь</kbd><kbd>ЛКМ</kbd></dt><dd>Прицел и огонь</dd>
  <dt><kbd>Shift</kbd></dt><dd>Замедлить время, пока есть фокус</dd>
  <dt><kbd>Q</kbd><kbd>ПКМ</kbd></dt><dd>Сальто: пули проходят мимо</dd>
  <dt><kbd>E</kbd></dt><dd>Пинок андроиду или кислородному баллону</dd>
  <dt><kbd>S</kbd><kbd>Пробел</kbd></dt><dd>Спрыгнуть с мостика</dd>
  <dt><kbd>R</kbd><kbd>Esc</kbd><kbd>M</kbd></dt><dd>Перезарядка, пауза, звук</dd>
 </dl>
 <p class="note">Подойди к терминалу, чтобы прочитать журнал экипажа. На телефоне держи экран горизонтально: слева бег, справа прыжок, сальто, пинок и замедление, касание поля — прицел и огонь.</p>
</div>`}
function statsHTML(rows){return`<dl class="stats">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`}
function levelClear(){
 if(S.state!=='play')return;S.state='clear';S.totalKills+=S.lkills;S.totalTime+=S.ltime;S.best=Math.max(S.best,S.bestCombo);sfx.door();
 const read=L.terms.filter(t=>t.read).length,nx=S.li+1<LEVELS.length;unlock(S.li+1);
 if(!nx){showFinale();return}
 showOverlay(`<div class="panel"><p class="eyebrow">Глава ${S.li+1} из 7 пройдена</p><h2>${L.def.name}</h2>
 <p class="lead">${L.def.clearLead}</p>
 ${statsHTML([['Время',fmtTime(S.ltime)],['Андроидов',S.lkills],['Лучшее комбо','×'+Math.min(10,S.bestCombo)],['Журналов',read+' / '+L.terms.length],['Очки',S.score.toLocaleString('ru-RU')]])}
 <div class="btns">${nx?`<button data-act="next">Дальше: ${LEVELS[S.li+1].name}</button>`:''}<button class="ghost" data-act="restart">Переиграть главу</button><button class="ghost" data-act="menu">В меню</button></div>
 <p class="note">${nx?'Счёт переносится в следующую главу.':`Продолжение следует: ${L.def.nextName}.`}</p></div>`);
}
function showDeath(){showOverlay(`<div class="panel"><p class="eyebrow">${L.def.chapter}</p><h2>Ярра Корд выбыла</h2>
 <p class="lead">Сальто спасает от пуль, замедление даёт время подумать, а грузчиков лучше не подпускать. Очки откатятся к началу главы.</p>
 <div class="btns"><button data-act="retry">${S.cp&&S.cp.li===S.li?'С контрольной точки':'Ещё раз'}</button><button class="ghost" data-act="menu">В меню</button></div><p class="note">R — заново</p></div>`)}
function pause(){S.state='pause';mouse.down=false;showOverlay(`<div class="panel"><p class="eyebrow">${L.def.chapter}</p><h2>Пауза</h2>
 <div class="btns"><button data-act="resume">Продолжить</button><button class="ghost" data-act="restart">Начать главу заново</button><button class="ghost" data-act="menu">В меню</button></div>
 <p class="note">Esc — продолжить, M — ${muted?'включить':'выключить'} звук</p></div>`)}
function play(){S.state='play';ov.hidden=true;ov.innerHTML='';mouse.down=false;try{cv.focus({preventScroll:true})}catch(e){}}
function toMenu(){S.score=0;S.ts=1;S.state='menu';showOverlay(menuHTML())}
function act(a){
 if(a==='start'){S.score=0;S.totalKills=0;S.totalTime=0;S.best=0;S.state='intro';S.introT=0;ov.hidden=true;ov.innerHTML=''}
 else if(a==='retry'){const cp=S.cp&&S.cp.li===S.li?S.cp:null;S.score=cp?cp.score:S.scoreAtLevel;loadLevel(S.li,false,cp);play()}
 else if(a==='restart'){S.cp=null;S.score=S.scoreAtLevel;loadLevel(S.li);play()}
 else if(a==='next'){const n=S.li+1;if(n<LEVELS.length){if(CUTS[n])startCut(n,()=>{loadLevel(n);play()});else{loadLevel(n);play()}}}
 else if(a&&a.startsWith('ch')){const n=clamp(+a.slice(2)||0,0,LEVELS.length-1);S.score=0;S.totalKills=0;S.totalTime=0;S.best=0;loadLevel(n);play()}
 else if(a==='finale')showFinale();
 else if(a&&a.startsWith('end')){const n=+a.slice(3)||1;startCut('e'+n,()=>{S.state='clear';showEnding(n)})}
 else if(a==='resume')play();
 else if(a==='menu')toMenu();
}
ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;initAudio();act(b.dataset.act)});

/* ---------- loop ---------- */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1)*RS;CW=cv.width=Math.floor(innerWidth*DPR);CH=cv.height=Math.floor(innerHeight*DPR);
 const lh=L?L.ph:560;ZB=Math.min(CH/lh,CW/720);Z=ZB*(1+S.zoom);VW=CW/Z;VH=CH/Z;
 LM.c.width=Math.ceil(CW/2);LM.c.height=Math.ceil(CH/2);
 [4,8,16,32].forEach((d,i)=>{BL[i].c.width=Math.max(1,Math.ceil(CW/d));BL[i].c.height=Math.max(1,Math.ceil(CH/d))});
 grainPat=null;FAR.c.width=Math.max(1,Math.ceil(CW/2));FAR.c.height=Math.max(1,Math.ceil(CH/2));FGB.c.width=Math.max(1,Math.ceil(CW/3));FGB.c.height=Math.max(1,Math.ceil(CH/3));
 if(GP)GP.size(CW,CH);ctx.imageSmoothingEnabled=true}
addEventListener('resize',resize);
let last=performance.now();
function frame(t){
 const raw=Math.min(.05,(t-last)/1000);last=t;S.t+=raw;
 perf(raw);updWaves(raw);let crt=0,game=false;
 if(S.state==='boot'){S.bootT+=raw;for(const k in press)delete press[k];if(S.bootT>=BOOT_END)toTitle();else{drawBoot(S.bootT);crt=1}}
 if(S.state==='title'||S.state==='menu'){for(const k in press)delete press[k];drawTitle(S.t,S.state==='title')}
 else if(S.state==='intro'){S.introT+=raw;for(const k in press)delete press[k];if(S.introT>=INTRO_END)endIntro();else drawIntro()}
 else if(S.state==='cut'&&S.cut){S.cut.t+=raw;for(const k in press)delete press[k];if(S.cut.t>=CUTS[S.cut.k].dur)endCut();else drawCut()}
 if(S.state==='play'||S.state==='dead'||S.state==='pause'||S.state==='clear'||S.state==='exit'){game=true;
  const gk=clamp((1-S.ts)/.7,0,1),zt=S.state==='exit'?.14*ease(clamp(S.exitT/1.6,0,1)):(S.state==='play'||S.state==='dead')?gk*.07+(S.killcam>0?.05:0):0;
  S.zoom=lerp(S.zoom,zt,Math.min(1,raw*5));Z=ZB*(1+S.zoom);VW=CW/Z;VH=CH/Z;
  if(S.iris<1)S.iris=Math.min(1,S.iris+raw*1.4);
  if(S.state==='play'||S.state==='dead')stepGame(raw);else{for(const k in press)delete press[k];if(S.state==='exit')stepExit(raw)}
  render();if(S.state==='exit'){const fa=clamp((S.exitT-1.95)/.5,0,1);if(fa>0){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=`rgba(0,0,0,${fa})`;ctx.fillRect(0,0,CW,CH)}}}
 if(GP){if(!game)clearEmit();try{GP.draw(cv,BL[0].c,postU(crt,game))}catch(e){}}
 requestAnimationFrame(frame);
}
async function start(){
 resize();
 try{await Promise.race([Promise.all([document.fonts.load(`800 30px Unbounded`),document.fonts.load(`500 16px "Golos Text"`),document.fonts.load(`500 14px "JetBrains Mono"`)]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
 buildWreck();S.state='boot';S.bootT=0;ov.hidden=true;
 try{window.claude?.hot?.snapshot?.(()=>({li:S.li,score:S.score}))}catch(e){}
 requestAnimationFrame(t=>{last=t;frame(t)});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
